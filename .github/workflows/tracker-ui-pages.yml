name: Tracker UI Pages
on:
  push:
    branches: [main]
    paths:
      - 'public/index.html'
      - '.github/workflows/tracker-ui-pages.yml'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: tracker-ui-pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: public
      - name: Deploy UI
        id: deployment
        uses: actions/deploy-pages@v4
