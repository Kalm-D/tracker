name: Tracker UI Pages
on:
  push:
    branches: [main]
    paths:
      - 'public/**'
      - '.github/workflows/tracker-ui-pages.yml'
      - 'tools/prepare-pages.cjs'
      - 'tools/prepare-automatic-pages.cjs'
      - 'tools/run-automatic-eod.cjs'
      - 'config/public-eod.json'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: tracker-pages-publish
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    outputs:
      artifact_name: github-pages-${{ github.run_attempt }}
      artifact_id: ${{ steps.upload.outputs.artifact_id }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Chỉ công bố HEAD mới nhất
        run: |
          git fetch origin main
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)"
      - uses: actions/configure-pages@v5
      - name: Đóng gói Pages theo policy quyền
        run: node tools/run-automatic-eod.cjs --ui-only

      - id: upload
        uses: actions/upload-pages-artifact@v4
        with:
          name: github-pages-${{ github.run_attempt }}
          path: work/pages

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      actions: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Chờ GitHub ghi nhận đúng gói đã tải lên
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: ${{ needs.build.outputs.artifact_id }}
        run: |
          for attempt in {1..12}; do
            if gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$ARTIFACT_ID" --silent; then
              exit 0
            fi
            sleep 5
          done
          exit 1
      - name: Deploy UI
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: ${{ needs.build.outputs.artifact_name }}
