name: Backtest correctness
on:
  pull_request:
  push:
    branches: [main, feat/backtest-engine]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: node tools/check-scripts.cjs
      - run: node --test tests/*.test.cjs
  snapshot-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Kiểm định bản web cá nhân không chứa snapshot công khai
        run: node tools/check-personal-pages.cjs
  financial-runtime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: bash tools/build-ai.sh
      - run: .venv-ai/bin/python -m unittest discover -s tests -p "test_*.py"
  market-data-runtime:
    if: github.head_ref == 'codex/tracker-core-p0-r4-dnse'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Cài bộ SDK DNSE đã ghim
        run: python -m pip install -r tracker-tools/requirements.txt
      - name: Kiểm tra adapter bằng fixture, không dùng khóa nguồn
        run: python -m unittest discover -s tests -p "test_*.py"
